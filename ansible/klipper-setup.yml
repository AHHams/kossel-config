---
- name: Apply kossel host customizations
  hosts: klipper
  become: true
  gather_facts: true

  vars:
    # Use the local SSH agent for private repo access.
    ansible_ssh_common_args: "-o ForwardAgent=yes"

    klipper_user: "anthony"
    klipper_home: "/home/{{ klipper_user }}"

    kossel_config_repo: "git@github.com:AHHams/kossel-config.git"
    kossel_config_version: "main"
    kossel_config_dir: "{{ klipper_home }}/kossel-config"
    printer_data_config_backup_suffix: ".pre-kossel-config"

    manage_git_identity: true
    git_user_name: "Anthony Hams"
    git_user_email: "anthony@hams.nl"

    locale_lang: "en_US.UTF-8"

    wifi_manage: true
    # Leave credentials off unless this playbook should manage them too.
    manage_wifi_credentials: false
    wifi_ssid: ""
    wifi_psk: ""
    wifi_disable_powersave: true
    wifi_disable_wake_on_wlan: true

    packages:
      - ca-certificates
      - curl
      - git
      - locales
      - netplan.io
      - network-manager
      - iw
      - wpasupplicant
      - zsh
      - wget
      - unzip
      - rsync
      - vim
      - htop
      - tmux

    set_zsh_as_default_shell: true

    install_packages: true
    apt_do_full_upgrade: true
    apt_reboot_after_upgrade: false

    install_klipperscreen: true
    klipperscreen_repo: "https://github.com/KlipperScreen/KlipperScreen.git"
    klipperscreen_version: "master"
    klipperscreen_dir: "{{ klipper_home }}/KlipperScreen"
    klipperscreen_backend: "X"
    klipperscreen_install_network_manager: "n"
    klipperscreen_start_after_install: "1"

  tasks:
    - name: apt update
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: install_packages | bool

    - name: Install packages
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present
      when: install_packages | bool

    - name: Check available locales
      ansible.builtin.command: locale -a
      register: locale_list
      changed_when: false

    - name: Ensure en_US.UTF-8 is enabled in locale.gen
      ansible.builtin.lineinfile:
        path: /etc/locale.gen
        regexp: '^#?\s*en_US\.UTF-8\s+UTF-8\s*$'
        line: 'en_US.UTF-8 UTF-8'
      when:
        - "'en_US.utf8' not in (locale_list.stdout_lines | default([]))"

    - name: Generate locales
      ansible.builtin.command: locale-gen
      when:
        - "'en_US.utf8' not in (locale_list.stdout_lines | default([]))"

    - name: Set default system locale
      ansible.builtin.command: "update-locale LANG={{ locale_lang | quote }}"
      changed_when: false

    - name: Check if zsh is installed
      ansible.builtin.stat:
        path: /usr/bin/zsh
      register: zsh_bin

    - name: Set default shell to zsh for klipper_user
      ansible.builtin.user:
        name: "{{ klipper_user }}"
        shell: /usr/bin/zsh
        state: present
      when:
        - zsh_bin.stat.exists
        - set_zsh_as_default_shell | bool

    - name: Ensure NetworkManager is running
      ansible.builtin.systemd:
        name: NetworkManager
        enabled: true
        state: started

    - name: Tune Wi-Fi connection via NetworkManager (no powersave)
      become: true
      when:
        - wifi_manage | bool
      block:
        - name: Get active wlan0 connection name
          ansible.builtin.command: nmcli -t -f GENERAL.CONNECTION dev show wlan0
          register: nm_wlan0_conn
          changed_when: false

        - name: Set active wlan0 connection fact
          ansible.builtin.set_fact:
            nm_wlan0_conn_name: "{{ (nm_wlan0_conn.stdout | default('') | regex_replace('^GENERAL\\.CONNECTION:', '')).strip() }}"

        - name: Ensure wlan0 connection is present
          ansible.builtin.assert:
            that:
              - nm_wlan0_conn_name | length > 0
            fail_msg: "Could not determine active wlan0 connection name via nmcli"

        - name: Ensure SSID matches (optional)
          ansible.builtin.command: >
            nmcli connection modify {{ nm_wlan0_conn_name | quote }}
            802-11-wireless.ssid {{ wifi_ssid | quote }}
          when:
            - manage_wifi_credentials | bool
            - (wifi_ssid | length) > 0

        - name: Read current Wi-Fi powersave setting
          ansible.builtin.command: >
            nmcli -g 802-11-wireless.powersave connection show {{ nm_wlan0_conn_name | quote }}
          register: nm_wifi_powersave
          changed_when: false

        - name: Ensure WPA2 PSK is set (optional)
          ansible.builtin.command: >
            nmcli connection modify {{ nm_wlan0_conn_name | quote }}
            802-11-wireless-security.key-mgmt wpa-psk
            802-11-wireless-security.psk {{ wifi_psk | quote }}
          when:
            - manage_wifi_credentials | bool
            - (wifi_psk | length) > 0

        - name: Disable Wi-Fi power saving
          ansible.builtin.command: >
            nmcli connection modify {{ nm_wlan0_conn_name | quote }}
            802-11-wireless.powersave 2
          when:
            - wifi_disable_powersave | bool
            - (nm_wifi_powersave.stdout | trim) != 'disable'

        - name: Read current Wi-Fi wake-on-wlan setting
          ansible.builtin.command: >
            nmcli -g 802-11-wireless.wake-on-wlan connection show {{ nm_wlan0_conn_name | quote }}
          register: nm_wifi_wowlan
          changed_when: false

        - name: Disable Wake-on-WLAN for Wi-Fi
          ansible.builtin.command: >
            nmcli connection modify {{ nm_wlan0_conn_name | quote }}
            802-11-wireless.wake-on-wlan 0
          when:
            - wifi_disable_wake_on_wlan | bool
            - (nm_wifi_wowlan.stdout | trim) != '0x0'

        - name: Disable Wi-Fi power saving immediately (runtime)
          ansible.builtin.command: /sbin/iw dev wlan0 set power_save off
          when: wifi_disable_powersave | bool
          changed_when: false
          failed_when: false

        - name: Reapply connection settings to wlan0 (best-effort)
          ansible.builtin.command: nmcli device reapply wlan0
          changed_when: false
          failed_when: false

    - name: apt full-upgrade
      ansible.builtin.apt:
        upgrade: full
      register: upgrade_result
      retries: 3
      delay: 15
      until: upgrade_result is succeeded
      when:
        - install_packages | bool
        - apt_do_full_upgrade | bool

    - name: Configure git global identity for klipper_user
      become: true
      become_user: "{{ klipper_user }}"
      ansible.builtin.command: "git config --global user.name {{ git_user_name | quote }}"
      changed_when: false
      when: manage_git_identity | bool

    - name: Configure git global email for klipper_user
      become: true
      become_user: "{{ klipper_user }}"
      ansible.builtin.command: "git config --global user.email {{ git_user_email | quote }}"
      changed_when: false
      when: manage_git_identity | bool

    # ---- SD longevity / stability ----
    - name: Disable swap service
      ansible.builtin.systemd:
        name: dphys-swapfile
        enabled: false
        state: stopped
      ignore_errors: true

    - name: swapoff (ok if already off)
      ansible.builtin.command: swapoff -a
      changed_when: false
      failed_when: false

    - name: Reboot after upgrades (if needed)
      ansible.builtin.reboot:
        msg: "Reboot after apt full-upgrade"
        reboot_timeout: 600
      when:
        - apt_reboot_after_upgrade | bool
        - upgrade_result is defined
        - upgrade_result is changed

    - name: Clone kossel-config
      become: false
      ansible.builtin.git:
        repo: "{{ kossel_config_repo }}"
        dest: "{{ kossel_config_dir }}"
        version: "{{ kossel_config_version }}"
        update: false
        accept_hostkey: true

    - name: Check if printer_data exists (created by Klipper install)
      become: true
      become_user: "{{ klipper_user }}"
      ansible.builtin.stat:
        path: "{{ klipper_home }}/printer_data"
        follow: false
      register: printer_data_dir

    - name: Note about creating printer_data/config symlink
      ansible.builtin.debug:
        msg:
          - "{{ klipper_home }}/printer_data not found yet."
          - "MainsailOS should normally create this path during first boot."
      when:
        - not printer_data_dir.stat.exists

    - name: Check existing printer_data/config
      become: true
      become_user: "{{ klipper_user }}"
      ansible.builtin.stat:
        path: "{{ klipper_home }}/printer_data/config"
        follow: false
      register: printer_data_config
      when:
        - printer_data_dir.stat.exists

    - name: Symlink printer_data/config to kossel-config/config (when missing)
      become: true
      become_user: "{{ klipper_user }}"
      ansible.builtin.file:
        src: "{{ kossel_config_dir }}/config"
        dest: "{{ klipper_home }}/printer_data/config"
        state: link
      when:
        - printer_data_dir.stat.exists
        - not printer_data_config.stat.exists

    - name: Backup existing printer_data/config before replacing it
      become: true
      become_user: "{{ klipper_user }}"
      ansible.builtin.command:
        argv:
          - mv
          - "{{ klipper_home }}/printer_data/config"
          - "{{ klipper_home }}/printer_data/config{{ printer_data_config_backup_suffix }}"
      when:
        - printer_data_dir.stat.exists
        - printer_data_config.stat.exists
        - not (printer_data_config.stat.islnk and (printer_data_config.stat.lnk_source | default('')) == (kossel_config_dir + '/config'))

    - name: Symlink printer_data/config to kossel-config/config after backup
      become: true
      become_user: "{{ klipper_user }}"
      ansible.builtin.file:
        src: "{{ kossel_config_dir }}/config"
        dest: "{{ klipper_home }}/printer_data/config"
        state: link
      when:
        - printer_data_dir.stat.exists
        - printer_data_config.stat.exists
        - not (printer_data_config.stat.islnk and (printer_data_config.stat.lnk_source | default('')) == (kossel_config_dir + '/config'))

    # ---- KlipperScreen ----
    - name: Clone KlipperScreen
      become: true
      become_user: "{{ klipper_user }}"
      ansible.builtin.git:
        repo: "{{ klipperscreen_repo }}"
        dest: "{{ klipperscreen_dir }}"
        version: "{{ klipperscreen_version }}"
        update: true
      when: install_klipperscreen | bool

    - name: Check if KlipperScreen service file exists
      ansible.builtin.stat:
        path: /etc/systemd/system/KlipperScreen.service
      register: klipperscreen_service_file
      when: install_klipperscreen | bool

    - name: Install KlipperScreen non-interactively
      become: true
      become_user: "{{ klipper_user }}"
      ansible.builtin.command:
        argv:
          - "{{ klipperscreen_dir }}/scripts/KlipperScreen-install.sh"
      environment:
        HOME: "{{ klipper_home }}"
        USER: "{{ klipper_user }}"
        SERVICE: "Y"
        BACKEND: "{{ klipperscreen_backend }}"
        NETWORK: "{{ klipperscreen_install_network_manager }}"
        START: "{{ klipperscreen_start_after_install }}"
      when:
        - install_klipperscreen | bool
        - not klipperscreen_service_file.stat.exists

    - name: Ensure KlipperScreen service is enabled and running
      ansible.builtin.systemd:
        name: KlipperScreen
        enabled: true
        state: started
      when: install_klipperscreen | bool
