---
- name: Prepare Raspberry Pi OS Lite for Klipper and stabilize Wi-Fi
  hosts: klipper
  become: true
  gather_facts: true

  vars:
    klipper_user: "anthony"
    klipper_home: "/home/{{ klipper_user }}"
    kiauh_dir: "{{ klipper_home }}/kiauh"

    # ---- This repo (kossel-config) ----
    kossel_config_repo: "git@github.com:AHHams/kossel-config.git"
    kossel_config_version: "main"
    kossel_config_dir: "{{ klipper_home }}/kossel-config"
    manage_printer_data_config_symlink: true

    # ---- Git identity ----
    manage_git_identity: true
    git_user_name: "Anthony Hams"
    git_user_email: "anthony@hams.nl"

    # ---- OpenCode (opencode) ----
    opencode_install: true
    opencode_install_method: "official_script"  # "official_script" or "skip"
    opencode_force_install: false

    # ---- Locale ----
    locale_lang: "en_US.UTF-8"

    # KIAUH is interactive; keep this false for reliability.
    kiauh_auto_install: false

    # ---- Wi-Fi stabilization (NetworkManager) ----
    wifi_manage: true
    wifi_ssid: "hams"
    wifi_psk: "_fGEx.PjM9wc"
    wifi_force_5ghz: true
    wifi_disable_powersave: true
    # Reduce roaming aggressiveness.
    nm_bgscan: "simple:120:-80:86400"

    apt_packages:
      - git
      - curl
      - wget
      - ca-certificates
      - unzip
      - rsync
      - vim
      - htop
      - tmux

      - python3
      - python3-pip
      - python3-venv
      - python3-dev

      - locales

      - build-essential
      - pkg-config
      - cmake
      - make
      - gcc
      - g++
      - gfortran

      - libopenblas-dev
      - libatlas-base-dev
      - liblapack-dev
      - libffi-dev
      - libfreetype6-dev
      - libpng-dev

      - libusb-1.0-0
      - libusb-1.0-0-dev

      - cpufrequtils

      # Wi-Fi tooling (Pi OS Lite is often minimal)
      - network-manager
      - iw
      - wireless-tools
      - wpasupplicant
      - rfkill

  handlers:
    - name: reboot_if_needed
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible"
        reboot_timeout: 600

  tasks:
    - name: apt update
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: apt full-upgrade
      ansible.builtin.apt:
        upgrade: full
      register: upgrade_result

    - name: Install baseline packages
      ansible.builtin.apt:
        name: "{{ apt_packages }}"
        state: present

    - name: Check available locales
      ansible.builtin.command: locale -a
      register: locale_list
      changed_when: false

    - name: Ensure en_US.UTF-8 is enabled in locale.gen
      ansible.builtin.lineinfile:
        path: /etc/locale.gen
        regexp: '^#?\s*en_US\.UTF-8\s+UTF-8\s*$'
        line: 'en_US.UTF-8 UTF-8'
      when: "'en_US.utf8' not in (locale_list.stdout_lines | default([]))"

    - name: Generate locales
      ansible.builtin.command: locale-gen
      when: "'en_US.utf8' not in (locale_list.stdout_lines | default([]))"

    - name: Set default system locale
      ansible.builtin.command: "update-locale LANG={{ locale_lang | quote }}"
      changed_when: false

    - name: Check if NetworkManager is active
      ansible.builtin.command: systemctl is-active NetworkManager
      register: nm_active
      changed_when: false
      failed_when: false

    - name: Tune Wi-Fi connection via NetworkManager (5 GHz + less roaming)
      become: true
      when:
        - wifi_manage | bool
        - (wifi_psk | length) > 0
        - nm_active.stdout | default('') == 'active'
      block:
        - name: Get active wlan0 connection name
          ansible.builtin.command: nmcli -t -f GENERAL.CONNECTION dev show wlan0
          register: nm_wlan0_conn
          changed_when: false

        - name: Set active wlan0 connection fact
          ansible.builtin.set_fact:
            nm_wlan0_conn_name: "{{ (nm_wlan0_conn.stdout | default('') | regex_replace('^GENERAL\\.CONNECTION:', '')).strip() }}"

        - name: Ensure wlan0 connection is present
          ansible.builtin.assert:
            that:
              - nm_wlan0_conn_name | length > 0
            fail_msg: "Could not determine active wlan0 connection name via nmcli"

        - name: Ensure SSID matches
          ansible.builtin.command: >
            nmcli connection modify {{ nm_wlan0_conn_name | quote }}
            802-11-wireless.ssid {{ wifi_ssid | quote }}

        - name: Ensure WPA2 PSK is set
          ansible.builtin.command: >
            nmcli connection modify {{ nm_wlan0_conn_name | quote }}
            802-11-wireless-security.key-mgmt wpa-psk
            802-11-wireless-security.psk {{ wifi_psk | quote }}

        - name: Force 5 GHz only
          ansible.builtin.command: >
            nmcli connection modify {{ nm_wlan0_conn_name | quote }}
            802-11-wireless.band a
          when: wifi_force_5ghz | bool

        - name: Reduce roaming aggressiveness
          ansible.builtin.command: >
            nmcli connection modify {{ nm_wlan0_conn_name | quote }}
            802-11-wireless.bgscan {{ nm_bgscan | quote }}

        - name: Disable Wi-Fi power saving
          ansible.builtin.command: >
            nmcli connection modify {{ nm_wlan0_conn_name | quote }}
            802-11-wireless.powersave 2
          when: wifi_disable_powersave | bool

        - name: Reapply connection settings to wlan0 (best-effort)
          ansible.builtin.command: nmcli device reapply wlan0
          changed_when: false
          failed_when: false

        - name: Get active wlan0 connection UUID
          ansible.builtin.command: nmcli -g connection.uuid connection show {{ nm_wlan0_conn_name | quote }}
          register: nm_wlan0_uuid
          changed_when: false

        - name: Find netplan file for active wlan0 connection
          ansible.builtin.shell: |
            set -euo pipefail
            uuid={{ nm_wlan0_uuid.stdout | quote }}
            grep -rl "$uuid" /etc/netplan/*.yaml | head -n 1
          args:
            executable: /bin/bash
          register: netplan_wifi_file
          changed_when: false

        - name: Ensure netplan file is found
          ansible.builtin.assert:
            that:
              - netplan_wifi_file.stdout | length > 0
            fail_msg: "Could not find /etc/netplan YAML for wlan0 connection"

        - name: Persist 5 GHz only in netplan
          ansible.builtin.lineinfile:
            path: "{{ netplan_wifi_file.stdout }}"
            regexp: '^\s+wifi\.band:'
            line: '              wifi.band: "a"'
            insertafter: '^\s+passthrough:\s*$'
          when: wifi_force_5ghz | bool
          register: netplan_band

        - name: Persist Wi-Fi password in netplan
          ansible.builtin.lineinfile:
            path: "{{ netplan_wifi_file.stdout }}"
            regexp: '^\s+password:'
            line: '            password: "{{ wifi_psk }}"'
          register: netplan_password

        - name: Persist roaming tuning in netplan
          ansible.builtin.lineinfile:
            path: "{{ netplan_wifi_file.stdout }}"
            regexp: '^\s+wifi\.bgscan:'
            line: '              wifi.bgscan: "{{ nm_bgscan }}"'
            insertafter: '^\s+passthrough:\s*$'
          register: netplan_bgscan

        - name: Persist Wi-Fi power saving setting in netplan
          ansible.builtin.lineinfile:
            path: "{{ netplan_wifi_file.stdout }}"
            regexp: '^\s+wifi\.powersave:'
            line: '              wifi.powersave: "2"'
            insertafter: '^\s+passthrough:\s*$'
          when: wifi_disable_powersave | bool
          register: netplan_powersave

        - name: Apply netplan (may briefly drop SSH)
          ansible.builtin.command: netplan apply
          async: 45
          poll: 0
          when: >-
            (netplan_band is changed) or
            (netplan_password is changed) or
            (netplan_bgscan is changed) or
            (netplan_powersave is changed)

        - name: Wait for SSH after netplan apply
          ansible.builtin.wait_for_connection:
            timeout: 120
          when: >-
            (netplan_band is changed) or
            (netplan_password is changed) or
            (netplan_bgscan is changed) or
            (netplan_powersave is changed)

    - name: Configure git global identity for klipper_user
      become: true
      become_user: "{{ klipper_user }}"
      ansible.builtin.command: "git config --global user.name {{ git_user_name | quote }}"
      changed_when: false
      when: manage_git_identity | bool

    - name: Configure git global email for klipper_user
      become: true
      become_user: "{{ klipper_user }}"
      ansible.builtin.command: "git config --global user.email {{ git_user_email | quote }}"
      changed_when: false
      when: manage_git_identity | bool

    - name: Check if opencode is already installed (official path)
      become: true
      become_user: "{{ klipper_user }}"
      ansible.builtin.stat:
        path: "{{ klipper_home }}/.opencode/bin/opencode"
      register: opencode_official
      when:
        - opencode_install | bool
        - opencode_install_method == 'official_script'

    - name: Install opencode (official installer)
      become: true
      become_user: "{{ klipper_user }}"
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL https://opencode.ai/install | bash
      args:
        executable: /bin/bash
      environment:
        SHELL: /bin/bash
      when:
        - opencode_install | bool
        - opencode_install_method == 'official_script'
        - opencode_force_install | bool or not opencode_official.stat.exists

    # ---- SD longevity / stability ----
    - name: Disable swap service
      ansible.builtin.systemd:
        name: dphys-swapfile
        enabled: false
        state: stopped
      ignore_errors: true

    - name: swapoff (ok if already off)
      ansible.builtin.command: swapoff -a
      changed_when: false
      failed_when: false

    - name: Limit journald size
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"

    - name: Write journald size limit
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/size.conf
        mode: "0644"
        content: |
          [Journal]
          SystemMaxUse=50M

    - name: Disable optional services (safe)
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - triggerhappy
        - avahi-daemon
        - bluetooth
      ignore_errors: true

    - name: Set CPU governor to performance
      ansible.builtin.copy:
        dest: /etc/default/cpufrequtils
        mode: "0644"
        content: |
          GOVERNOR="performance"

    - name: Enable cpufrequtils
      ansible.builtin.systemd:
        name: cpufrequtils
        enabled: true
        state: started
      ignore_errors: true

    - name: Reboot after upgrades (if needed)
      ansible.builtin.reboot:
        msg: "Reboot after apt full-upgrade"
        reboot_timeout: 600
      when: upgrade_result is changed

    # ---- KIAUH ----
    - name: Clone KIAUH
      become: true
      become_user: "{{ klipper_user }}"
      ansible.builtin.git:
        repo: "https://github.com/dw-0/kiauh.git"
        dest: "{{ kiauh_dir }}"
        version: master
        update: true

    - name: Clone kossel-config
      become: true
      become_user: "{{ klipper_user }}"
      ansible.builtin.git:
        repo: "{{ kossel_config_repo }}"
        dest: "{{ kossel_config_dir }}"
        version: "{{ kossel_config_version }}"
        update: true
        accept_hostkey: true

    - name: Optional note about running KIAUH
      ansible.builtin.debug:
        msg:
          - "KIAUH cloned to {{ kiauh_dir }}."
          - "Run manually: cd ~/kiauh && ./kiauh.sh (install Klipper, Moonraker, Mainsail)"
          - "kossel-config cloned to {{ kossel_config_dir }}."
      when: not (kiauh_auto_install | bool)

    - name: Check if printer_data exists (created by Klipper install)
      become: true
      become_user: "{{ klipper_user }}"
      ansible.builtin.stat:
        path: "{{ klipper_home }}/printer_data"
        follow: false
      register: printer_data_dir
      when: manage_printer_data_config_symlink | bool

    - name: Note about creating printer_data/config symlink
      ansible.builtin.debug:
        msg:
          - "{{ klipper_home }}/printer_data not found yet."
          - "Install Klipper/Moonraker/Mainsail via KIAUH first, then re-run this playbook to create the config symlink."
      when:
        - manage_printer_data_config_symlink | bool
        - not printer_data_dir.stat.exists

    - name: Check existing printer_data/config
      become: true
      become_user: "{{ klipper_user }}"
      ansible.builtin.stat:
        path: "{{ klipper_home }}/printer_data/config"
        follow: false
      register: printer_data_config
      when:
        - manage_printer_data_config_symlink | bool
        - printer_data_dir.stat.exists

    - name: Symlink printer_data/config to kossel-config/config (when missing)
      become: true
      become_user: "{{ klipper_user }}"
      ansible.builtin.file:
        src: "{{ kossel_config_dir }}/config"
        dest: "{{ klipper_home }}/printer_data/config"
        state: link
      when:
        - manage_printer_data_config_symlink | bool
        - printer_data_dir.stat.exists
        - not printer_data_config.stat.exists

    - name: Determine existing printer_data/config type
      ansible.builtin.set_fact:
        printer_data_config_type: >-
          {{
            'symlink' if printer_data_config.stat.islnk else
            ('directory' if printer_data_config.stat.isdir else 'file')
          }}
      when:
        - manage_printer_data_config_symlink | bool
        - printer_data_dir.stat.exists
        - printer_data_config.stat.exists

    - name: Warn if printer_data/config exists and is not the expected symlink
      ansible.builtin.debug:
        msg:
          - "Skipping symlink: {{ klipper_home }}/printer_data/config already exists."
          - "Current type: {{ printer_data_config_type | default('unknown') }}"
          - "If you want to symlink it to {{ kossel_config_dir }}/config, move it aside and re-run this playbook."
      when:
        - manage_printer_data_config_symlink | bool
        - printer_data_dir.stat.exists
        - printer_data_config.stat.exists
        - not (printer_data_config.stat.islnk and (printer_data_config.stat.lnk_source | default('')) == (kossel_config_dir + '/config'))

    # ---- Input shaper python deps ----
    - name: Check if klippy virtualenv exists (after KIAUH install)
      become: true
      become_user: "{{ klipper_user }}"
      ansible.builtin.stat:
        path: "{{ klipper_home }}/klippy-env/bin/pip"
      register: klippy_pip

    - name: Install numpy+matplotlib into klippy-env (for shaper scripts/plots)
      become: true
      become_user: "{{ klipper_user }}"
      ansible.builtin.command: >
        {{ klipper_home }}/klippy-env/bin/pip install --upgrade pip numpy matplotlib
      when: klippy_pip.stat.exists

    - name: Reminder if klippy-env is missing
      ansible.builtin.debug:
        msg:
          - "klippy-env not found at {{ klipper_home }}/klippy-env yet."
          - "Install Klipper via KIAUH first, then re-run this playbook to add numpy/matplotlib."
      when: not klippy_pip.stat.exists
