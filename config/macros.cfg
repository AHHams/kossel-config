[gcode_macro RUN_PROBE_CALIBRATE]
description: Start PROBE_CALIBRATE
gcode:
  G1 X0 Y0 Z30 F9000
  PROBE_CALIBRATE

[gcode_macro RUN_PROBE_ACCURACY]
description: Run PROBE_ACCURACY with defaults
gcode:
  G1 X0 Y0 Z30 F9000
  PROBE_ACCURACY

[gcode_macro RUN_BASIC_DELTA_CALIBRATE]
description: Run basic DELTA_CALIBRATE
gcode:
  DELTA_CALIBRATE

[gcode_macro FILAMENT_RUNOUT]
gcode:
    RESPOND TYPE=error MSG="Filament runout detected"
    PAUSE

[gcode_macro PRINT_START]
gcode:
  # parameters are optional: BED=, EXTRUDER=
  {% set bed = params.BED|default(0)|float %}
  {% set hotend = params.EXTRUDER|default(0)|float %}
  M140 S{bed}
  M104 S{hotend}
  G28
  G91
  G1 Z-30 F3000
  G90
  M190 S{bed}
  M109 S{hotend}

[gcode_macro PRINT_END]
gcode:
  M104 S0
  M140 S0
  M107
  G91
  G1 Z10 F1200
  G90
  G28